name: lab9 platform ops

# Pull request: unit tests.
# Merge to main or manual run: unit tests, then the end-to-end scenario in dbr_dev
# (daily job, smoke check on a temporary cluster) as the service principal.

on:
  pull_request:
    branches: [main]
    paths:
      - "lab9/**"
      - ".github/workflows/lab9-platform-ops.yml"
  push:
    branches: [main]
    paths:
      - "lab9/**"
      - ".github/workflows/lab9-platform-ops.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab9

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab9/pyproject.toml
      - name: Install the package with test dependencies
        run: pip install -e ".[test]"
      - name: Run unit tests
        run: pytest

  e2e:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest
    # the service principal credentials are stored in this GitHub environment
    environment: prod
    # one end-to-end run at a time; a newer one waits instead of cancelling a running job
    concurrency:
      group: lab9-e2e
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      DATABRICKS_HOST: https://adb-7405604651938730.10.azuredatabricks.net
      DATABRICKS_AUTH_TYPE: azure-client-secret
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab9/pyproject.toml
      - name: Install the package
        run: pip install -e .
      - name: Run the daily job and the smoke check on a temporary cluster
        run: platform-ops --target dev e2e