name: lab12 CI/CD

# Pull request to main: unit tests and validation of the PROD bundle.
# Merge to main: unit tests, then deploy to PROD. Jobs are not run here, the refresh job
# rebuilds the knowledge base and the evaluate job calls the models, both are started by hand.
# PROD is changed only by this workflow, authenticated as the service principal.

on:
  pull_request:
    branches: [main]
    paths:
      - "lab12/**"
      - ".github/workflows/lab12-cicd.yml"
  push:
    branches: [main]
    paths:
      - "lab12/**"
      - ".github/workflows/lab12-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab12

env:
  DATABRICKS_CLI_VERSION: "1.20.0"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab12/pyproject.toml
      - name: Install the package with the test tools
        run: pip install -e ".[test]"
      - name: Run unit tests with the coverage threshold
        run: pytest --cov

  validate-prod:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: lab12
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_owner_email: ${{ vars.LAB12_OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate the PROD bundle
        run: databricks bundle validate -t prod

  deploy-prod:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: lab12
    # one deployment at a time; a newer merge waits instead of cancelling a running deployment
    concurrency:
      group: lab12-prod-deploy
      cancel-in-progress: false
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_owner_email: ${{ vars.LAB12_OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}
      - name: Validate
        run: databricks bundle validate -t prod
      # without --auto-approve a change that deletes resources stops here and needs a human
      - name: Deploy
        run: databricks bundle deploy -t prod
