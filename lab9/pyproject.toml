[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-ops"
version = "0.1.0"
description = "Lab 9: Databricks platform automation with the Python SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sdk==0.159.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
platform-ops = "platform_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"